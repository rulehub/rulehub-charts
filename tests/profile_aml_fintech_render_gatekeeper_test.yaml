---
suite: Profile aml-fintech renders Gatekeeper FinTech policies

templates:
  - templates/gatekeeper.yaml

tests:
  - it: renders AMLIntegrationRequired Constraint
    set:
      gatekeeper:
        enabled: true
        useProfilesOnly: true
      activeProfiles:
        - aml-fintech
    documentSelector:
      path: apiVersion
      value: constraints.gatekeeper.sh/v1beta1
    asserts:
      - isKind:
          of: AMLIntegrationRequired
      - equal:
          path: metadata.name
          value: fintech-aml-integration-required
