---
suite: Igaming Gatekeeper templates requiredLabel schema

templates:
  - templates/gatekeeper.yaml

tests:
  - it: betting-ads_no_minors_targeting has requiredLabel type string
    set:
      gatekeeper:
        enabled: true
        policies:
          betting-ads_no_minors_targeting-constraint:
            enabled: true
    documentSelector:
      path: metadata.name
      value: betting-ads-no-minors-targeting
    asserts:
      - equal:
          path: spec.crd.spec.validation.openAPIV3Schema.properties.requiredLabel.type
          value: string
  - it: betting-kyc_on_withdrawal has requiredLabel type string
    set:
      gatekeeper:
        enabled: true
        policies:
          betting-kyc_on_withdrawal-constraint:
            enabled: true
    documentSelector:
      path: metadata.name
      value: betting-kyc-on-withdrawal
    asserts:
      - equal:
          path: spec.crd.spec.validation.openAPIV3Schema.properties.requiredLabel.type
          value: string
