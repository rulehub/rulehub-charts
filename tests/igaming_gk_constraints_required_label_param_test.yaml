---
suite: Igaming Gatekeeper constraints requiredLabel parameter

templates:
  - templates/gatekeeper.yaml

tests:
  - it: betting-license_check_us_nv_ngcb constraint uses parameters.requiredLabel=jurisdiction
    set:
      gatekeeper:
        enabled: true
        policies:
          betting-license_check_us_nv_ngcb-constraint:
            enabled: false
          betting-license-check-us-nv-ngcb-constraint:
            enabled: true
    documentSelector:
      path: kind
      value: BettingLicenseCheckUsNvNgcb
    asserts:
      - equal:
          path: spec.parameters.requiredLabel
          value: jurisdiction
  - it: betting-license_check_us_pa_pgcb constraint uses parameters.requiredLabel=jurisdiction
    set:
      gatekeeper:
        enabled: true
        policies:
          betting-license_check_us_pa_pgcb-constraint:
            enabled: false
          betting-license-check-us-pa-pgcb-constraint:
            enabled: true
    documentSelector:
      path: kind
      value: BettingLicenseCheckUsPaPgcb
    asserts:
      - equal:
          path: spec.parameters.requiredLabel
          value: jurisdiction
  - it: betting-self_exclusion_uk_gamstop constraint uses parameters.requiredLabel=jurisdiction
    set:
      gatekeeper:
        enabled: true
        policies:
          betting-self_exclusion_uk_gamstop-constraint:
            enabled: false
          betting-self-exclusion-uk-gamstop-constraint:
            enabled: true
    documentSelector:
      path: kind
      value: BettingSelfExclusionUkGamstop
    asserts:
      - equal:
          path: spec.parameters.requiredLabel
          value: jurisdiction
