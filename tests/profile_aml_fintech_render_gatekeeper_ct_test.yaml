---
suite: Profile aml-fintech renders Gatekeeper ConstraintTemplate

templates:
  - templates/gatekeeper.yaml

tests:
  - it: renders AMLIntegrationRequired ConstraintTemplate
    set:
      gatekeeper:
        enabled: true
        useProfilesOnly: true
      activeProfiles:
        - aml-fintech
    documentSelector:
      kind: ConstraintTemplate
      name: fintech-aml-integration-required
    asserts:
      - isKind:
          of: ConstraintTemplate
      - equal:
          path: metadata.name
          value: fintech-aml-integration-required
