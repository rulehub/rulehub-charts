{{- if .Values.gatekeeper.enabled }}
{{- /* When useProfilesOnly=true, ignore base policies map; else use .Values.gatekeeper.policies */ -}}
{{- $pol := ternary (dict) .Values.gatekeeper.policies .Values.gatekeeper.useProfilesOnly }}

{{- /* ConstraintTemplates */ -}}
{{ include "policy-sets.gk.loop" (dict "glob" "files/gatekeeper-templates/*.yaml" "pol" $pol "root" .) }}

{{- /* Constraints */ -}}
{{ include "policy-sets.gk.loop" (dict "glob" "files/gatekeeper/*.yaml" "pol" $pol "root" .) }}
{{- end }}
