repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^templates/.*\.yaml$
      - id: detect-private-key
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        additional_dependencies: []
        # Let pre-commit pass the file list; don't scan the whole repo (avoids .git cache)
        args: ["-c", ".yamllint"]
  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint (fast)
        entry: bash -c 'helm lint . || true'
        language: system
        pass_filenames: false

      - id: validate-values-schema
        name: values schema validate
        entry: hack/verify/verify-values-schema.sh
        language: system
        pass_filenames: false

      - id: verify-policies-sync
        name: verify policies sync (values <-> files)
        entry: hack/verify/verify-policies-sync.sh
        language: system
        pass_filenames: false

      - id: verify-id-name-alignment
        name: verify id <-> name alignment
        entry: hack/verify/verify-id-name-alignment.sh
        language: system
        pass_filenames: false

      - id: make-lint
        name: make lint (helm + ct)
        entry: bash -c 'command -v make >/dev/null && make lint || echo "(make lint failed or unavailable)"'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: verify-id-annotation
        name: verify rulehub.id annotations
        entry: hack/verify/verify-id-annotation.sh
        language: system
        pass_filenames: false

      - id: verify-policy-annotations
        name: verify policy annotations schema
        entry: bash hack/verify/verify-policy-annotations.sh
        language: system
        pass_filenames: false

      - id: values-table-up-to-date
        name: values table up-to-date
        entry: hack/verify/verify-values-table.sh
        language: system
        pass_filenames: false

      - id: verify-chart-version-label
        name: verify chart/version label on rendered resources
        entry: hack/verify/verify-chart-version-label.sh
        language: system
        pass_filenames: false

      - id: render-verify
        name: verify rendered manifest naming
        entry: bash -c './hack/verify/verify-render.sh .'
        language: system
        pass_filenames: false

      - id: verify-deterministic
        name: verify deterministic template render
        entry: hack/verify/verify-deterministic.sh
        language: system
        pass_filenames: false

      - id: schema-version-verify
        name: verify values schemaVersion const
        entry: hack/verify/verify-schema-version.sh
        language: system
        pass_filenames: false

      - id: build-annotations-verify
        name: verify build annotations present when configured
        entry: hack/verify/verify-build-annotations.sh
        language: system
        pass_filenames: false

      - id: helm-docs
        name: helm-docs
        entry: bash -c 'command -v helm-docs && helm-docs || echo "helm-docs not installed"'
        language: system
        files: (Chart.yaml|values.yaml|README.md)
        pass_filenames: false

      # Additional verification hooks (kept lightweight by default; heavy/ref-dependent marked manual)

      - id: verify-profiles
        name: verify profiles render declared policies
        entry: hack/verify/verify-profiles.sh
        language: system
        pass_filenames: false

      - id: verify-profile-consistency
        name: verify profiles internal consistency
        entry: hack/verify/verify-profile-consistency.sh
        language: system
        pass_filenames: false

      - id: enforce-rationale
        name: verify Kyverno enforce rationale present
        entry: hack/verify/verify-enforce-rationale.sh
        language: system
        pass_filenames: false

      - id: schema-coverage
        name: schema coverage of values.yaml
        entry: bash hack/tools/schema-coverage.sh
        language: system
        pass_filenames: false

      - id: schema-compare
        name: schema compare (values vs values.schema.json)
        entry: bash hack/tools/compare-values-schema.sh
        language: system
        pass_filenames: false
      - id: size-verify
        name: verify rendered manifest size
        entry: hack/verify/verify-size.sh
        language: system
        pass_filenames: false
        args: ["--threshold", "320000"]

      - id: integrity-verify
        name: verify policy YAML integrity (manifest + hashes)
        entry: hack/verify/verify-integrity.sh
        language: system
        pass_filenames: false

      - id: integrity-configmap-verify
        name: verify integrity ConfigMap exported when enabled
        entry: hack/verify/verify-integrity-configmap.sh
        language: system
        pass_filenames: false

      - id: manifest-verify
        name: verify manifest.json schema
        entry: bash hack/verify/verify-manifest-schema.sh
        language: system
        pass_filenames: false

      - id: kubeconform-verify
        name: verify kubeconform checksum (tooling integrity)
        entry: hack/verify/verify-kubeconform-checksum.sh
        language: system
        pass_filenames: false

      - id: stub-not-enforce-verify
        name: verify deprecated stub policies are not enforced
        entry: hack/verify/verify-stub-not-enforce.sh
        language: system
        pass_filenames: false

      - id: soft-deletion-verify
        name: verify deprecated stubs removed after soft deletion window
        entry: hack/verify/verify-soft-deletion.sh
        language: system
        pass_filenames: false

      - id: underscore-gate
        name: underscore gate for new policy keys (diff vs base)
        entry: hack/verify/verify-underscore-gate.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: deprecation-verify
        name: verify deprecation window
        entry: hack/verify/verify-deprecation-window.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: freeze-verify
        name: verify release freeze window
        entry: hack/verify/verify-freeze.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: removed-without-deprecation-verify
        name: verify removed policy files were previously deprecated
        entry: hack/verify/verify-removed-without-deprecation.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: drift-index-verify
        name: verify drift vs core index.json
        entry: hack/verify/verify-drift-index.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: performance-verify
        name: verify template performance regression within threshold
        entry: hack/verify/verify-performance.sh
        language: system
        pass_filenames: false
        stages: [manual]

      - id: plugin-index-verify
        name: verify generated plugin index
        entry: hack/verify/verify-plugin-index.sh
        language: system
        pass_filenames: false
        stages: [manual]

exclude: |
  ^\.git/|
  ^dist/|
  ^tmp/
